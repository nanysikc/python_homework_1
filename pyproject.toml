[project]
name = "homework-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nana", email = "ratkooyme@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
homework-1 = "homework_1:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []